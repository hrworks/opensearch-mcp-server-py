# FORK: Disabled - OpenSearch project-specific issue triage
# Original trigger: on: issues: types: [opened, reopened, transferred]

name: Apply 'untriaged' label (DISABLED IN FORK)

on:
  workflow_dispatch:  # Manual trigger only, if ever needed

permissions:
  issues: write

jobs:
  apply-label:
    if: false  # FORK: Never run
    runs-on: ubuntu-latest
    steps:
      - name: Add `untriaged` Label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['untriaged']
            })
